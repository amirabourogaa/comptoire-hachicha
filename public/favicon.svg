<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A7356"/>
      <stop offset="100%" style="stop-color:#5B4C3A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,240)" fill="none" stroke="#F4EFE6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shopping bag body -->
    <rect x="-120" y="-40" width="240" height="180" rx="16"/>
